# Mandatory properties. No H2 fallback when postgres is active.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${MIGRATION_USER}
spring.flyway.password=${MIGRATION_PASSWORD}
spring.flyway.locations=classpath:db/migration,classpath:db/postgresql
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
app.backup-enabled=false
