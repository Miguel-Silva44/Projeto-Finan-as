# The development profile uses its own database, independent of DATABASE_URL.
spring.datasource.url=${DEV_DATABASE_URL:jdbc:h2:file:./data/dev/financas;MODE=PostgreSQL;NON_KEYWORDS=MONTH;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DEV_DATABASE_USER:sa}
spring.datasource.password=${DEV_DATABASE_PASSWORD:}
app.dev.email=${DEV_LOGIN_EMAIL:dev@financas.local}
app.dev.password=${DEV_LOGIN_PASSWORD:DevFinanceiro123!}
app.mail-mode=file
