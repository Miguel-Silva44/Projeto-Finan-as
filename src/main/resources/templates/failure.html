<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confira os dados · Finanças</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script defer src="/js/app.js"></script>
  </head>
  <body class="auth-body">
    <main class="error-card">
      <span class="eyebrow">VAMOS CONFERIR</span>
      <h1>Não foi possível concluir</h1>
      <p role="alert" th:text="${errorMessage}"></p>
      <p class="muted">
        A operação não foi concluída. Volte ao formulário para corrigir os dados
        ou recarregue a página.
      </p>
      <div class="actions">
        <button class="button primary" data-back>Voltar ao formulário</button
        ><a class="button secondary" href="/dashboard">Abrir início</a>
      </div>
      <small th:text="${code+' · '+correlation}"></small>
    </main>
  </body>
</html>
