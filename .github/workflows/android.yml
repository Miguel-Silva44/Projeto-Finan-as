name: Verify Android debug
on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', 'scripts/*android*', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and lint without release credentials
        working-directory: android
        run: bash gradlew assembleDebug lintDebug -PfinanceEnvironment=hml --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-setup-screen
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results*.html
